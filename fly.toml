app = "pinjam-in"
primary_region = "sin"

[build]
  dockerfile = "fly.Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "info"
  CACHE_STORE = "file"
  QUEUE_CONNECTION = "database"
  SESSION_DRIVER = "database"
  SESSION_LIFETIME = "120"
